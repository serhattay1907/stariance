version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /packages/stagorix
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /packages/stagorix
    schedule:
      interval: monthly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /packages/stagorix/render
    schedule:
      interval: monthly
    groups:
      # Remotion packages must move together, in one PR.
      remotion:
        patterns: ["remotion", "@remotion/*"]
      # React, its DOM renderer and its types only work at the same major.
      react:
        patterns: ["react", "react-dom", "@types/react"]
      npm-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["remotion", "@remotion/*", "react", "react-dom", "@types/react"]
    ignore:
      # zod is pinned to the version Remotion itself uses (see DECISIONS 2026-10-29);
      # bump it by hand with every Remotion update (`npm ls zod` must show one version).
      - dependency-name: zod
