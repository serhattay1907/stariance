name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene (secrets, attribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No AI attribution in commits
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_attribution.py --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: No AI attribution in files
        run: python3 scripts/check_attribution.py --files
      - name: Attribution checker tests
        run: python3 scripts/test_check_attribution.py

  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: uv sync --frozen
        working-directory: packages/stagorix
      - run: uv run ruff check .
        working-directory: packages/stagorix
      - run: uv run ruff format --check .
        working-directory: packages/stagorix
      - run: uv run pytest
        working-directory: packages/stagorix
      - uses: actions/setup-node@v7
        with:
          node-version-file: packages/stagorix/.nvmrc
          cache: npm
          cache-dependency-path: packages/stagorix/render/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: packages/stagorix/render
      - run: npm run typecheck
        working-directory: packages/stagorix/render
      - name: Dependency licenses (Python and npm)
        if: runner.os == 'Linux'
        run: uv run stagorix licenses
        working-directory: packages/stagorix

  golden:
    name: Golden test (Docker, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # Same CPU architecture as Apple Silicon Macs, whose Docker runs linux/arm64.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker compose build
        working-directory: packages/stagorix
      - name: Run golden test
        run: docker compose run --rm worker stagorix verify
        working-directory: packages/stagorix
      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-output-${{ matrix.arch }}
          path: packages/stagorix/workspace/verify/
          retention-days: 14
